{% set rid = field.id %}
{% set current = data or "" %}
{# Inject initial value into a namespaced global — same safe pattern as blocks.html #}
<script>
(function () {
  if (!window.__jbRichInit) window.__jbRichInit = {};
  window.__jbRichInit[{{ rid | tojson | safe }}] = {{ current | tojson | safe }};
})();
</script>

<div class="jb-rich-text"
     x-data="richTextEditor(window.__jbRichInit[{{ rid | tojson }}])">

  <div class="jb-toolbar">
    <button type="button" class="jb-toolbar-btn" @click.prevent="format('bold')" title="Bold"><strong>B</strong></button>
    <button type="button" class="jb-toolbar-btn" @click.prevent="format('italic')" title="Italic"><em>I</em></button>
    <button type="button" class="jb-toolbar-btn" @click.prevent="format('h2')" title="Heading 2">H2</button>
    <button type="button" class="jb-toolbar-btn" @click.prevent="format('h3')" title="Heading 3">H3</button>
    <button type="button" class="jb-toolbar-btn" @click.prevent="format('ul')" title="Bullet list">•</button>
    <button type="button" class="jb-toolbar-btn" @click.prevent="format('ol')" title="Numbered list">1.</button>
  </div>

  <div class="jb-text-body"
       contenteditable="true"
       x-init="$el.innerHTML = value"
       @input="value = $event.target.innerHTML"
       placeholder="{{ field.label }}…"></div>

  <input type="hidden" :name="'{{ rid }}'" :value="value">
</div>

<script>
(function () {
  if (window.richTextEditor) return;
  window.richTextEditor = function richTextEditor(initial) {
    return {
      value: initial || '',
      format: function (cmd) {
        if (cmd === 'bold')   { document.execCommand('bold');   return; }
        if (cmd === 'italic') { document.execCommand('italic'); return; }
        if (cmd === 'h2')     { document.execCommand('formatBlock', false, '<h2>'); return; }
        if (cmd === 'h3')     { document.execCommand('formatBlock', false, '<h3>'); return; }
        if (cmd === 'ul')     { document.execCommand('insertUnorderedList'); return; }
        if (cmd === 'ol')     { document.execCommand('insertOrderedList');   return; }
      },
    };
  };
})();
</script>

<style>
.jb-rich-text { margin-bottom: .5rem; }
.jb-toolbar { display: flex; gap: .25rem; margin-bottom: .35rem; }
.jb-toolbar-btn {
  padding: .15rem .45rem;
  font-size: .8rem;
  border: 1px solid var(--tblr-border-color, #444);
  border-radius: 4px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  min-width: 2rem;
}
.jb-toolbar-btn:hover { background: var(--tblr-primary, #0fce8f); color: var(--jb-dark, #0d0d1a); border-color: var(--tblr-primary, #0fce8f); }
.jb-text-body {
  min-height: 80px;
  padding: .5rem;
  border: 1px solid var(--tblr-border-color, #444);
  border-radius: 4px;
  background: var(--jb-dark-grey, #1e1e2e);
  color: var(--jb-light, #fbfbfb);
  outline: none;
  line-height: 1.5;
}
.jb-text-body:focus { border-color: var(--jb-light, #fbfbfb); }
.jb-text-body:empty:before { content: attr(placeholder); color: var(--jb-light-grey, #888); pointer-events: none; }
</style>
