{% set fid = field.id %}
<div x-data="svgUpload()" class="jb-svg-upload"
     @dragover.prevent="dragging=true"
     @dragleave.prevent="dragging=false"
     @drop.prevent="onDrop($event)">

  {# ── Hidden file input, triggered by button ── #}
  <input type="file"
         x-ref="fileInput"
         name="{{ fid }}"
         id="{{ fid }}"
         accept=".svg,image/svg+xml"
         class="d-none"
         @change="onFile($event)"
         {{ 'required' if field.required else '' }}>

  <div class="d-flex align-items-center gap-2" :class="dragging ? 'jb-svg-dragover-zone' : ''">
    <button type="button" class="btn btn-secondary btn-sm" @click="$refs.fileInput.click()">
      Choose file
    </button>
    <small class="text-muted fst-italic" x-text="filename || 'No file chosen'"></small>
  </div>

  {% if field.help_text %}
    <small class="form-hint mt-1 d-block">{{ field.help_text }}</small>
  {% endif %}

  {# ── Progress bar ── #}
  <div x-show="reading" x-cloak class="mt-2">
    <div class="jb-svg-progress">
      <div class="jb-svg-progress-bar" :style="'width:' + progress + '%'"></div>
    </div>
  </div>

  {# ── Live preview on selection ── #}
  <div x-show="preview" x-cloak class="mt-3 jb-svg-preview-row">
    <div class="text-center">
      <div class="jb-svg-swatch jb-svg-swatch--light">
        <img :src="preview" width="48" height="48" alt="">
      </div>
      <small class="text-muted d-block mt-1">Light</small>
    </div>
    <div class="text-center">
      <div class="jb-svg-swatch jb-svg-swatch--dark">
        <img :src="preview" width="48" height="48" alt="">
      </div>
      <small class="text-muted d-block mt-1">Dark</small>
    </div>
  </div>

</div>

<script>
(function () {
  if (window.svgUpload) return;
  window.svgUpload = function () {
    return {
      preview:  null,
      filename: null,
      progress: 0,
      reading:  false,
      dragging: false,
      onDrop(e) {
        this.dragging = false;
        const file = e.dataTransfer?.files[0];
        if (!file) return;
        this._read(file);
      },
      onFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        this._read(file);
      },
      _read(file) {
        this.filename = file.name;
        this.reading  = true;
        this.progress = 0;
        this.preview  = null;
        const reader = new FileReader();
        reader.onprogress = ev => {
          if (ev.lengthComputable)
            this.progress = Math.round(ev.loaded / ev.total * 100);
        };
        reader.onload = ev => {
          this.progress = 100;
          this.reading  = false;
          this.preview  = ev.target.result;
        };
        reader.readAsDataURL(file);
      },
    };
  };
})();
</script>
