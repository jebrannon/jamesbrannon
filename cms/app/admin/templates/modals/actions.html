<div class="modal fade jj-dialog" id="modal-action" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Are you sure?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <p class="jj-dialog-body" id="actionConfirmation"></p>
        <div id="modal-form"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="actionSubmit" type="button" class="btn btn-danger" data-bs-dismiss="modal">Confirm</button>
      </div>

    </div>
  </div>
</div>
