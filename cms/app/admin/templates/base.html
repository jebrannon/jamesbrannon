<!DOCTYPE html>
<html lang="{{ get_locale() }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  {% block head_meta %}{% endblock %}
  {% block title %}<title>James / {{ title or app_title }}</title>{% endblock %}

  <link rel="icon" type="image/svg+xml" href="/static/admin-favicon.svg">
  <link rel="stylesheet" href="/static/tabler.desktop.css">
  <link rel="stylesheet" href="{{ url_for(__name__ ~ ':statics', path='css/fontawesome.min.css') }}">

  <style>
    .navbar-logo { width: auto; height: 2rem; }
  </style>

  <script>document.documentElement.setAttribute('data-bs-theme', 'dark');</script>
  <link rel="stylesheet" href="/static/admin-tokens.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root { --tblr-font-sans-serif: 'Barlow Semi Condensed', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>

  {% block head_css %}{% endblock %}
</head>

<body>
{% block body %}{% endblock %}
{% block modal %}{% endblock %}
<script src="{{ url_for(__name__ ~ ':statics', path='js/vendor/jquery.min.js') }}"></script>
<script src="{{ url_for(__name__ ~ ':statics', path='js/vendor/js.cookie.min.js') }}"></script>
<script src="{{ url_for(__name__ ~ ':statics', path='js/vendor/tabler.min-1.1.0.js') }}"></script>
{% block script %}
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
{% endblock %}
<script>
  $(function () {
    $(".language-switcher-item").each(function () {
      let el = $(this);
      el.on("click", function () {
        Cookies.set(String(el.data("cookie-name")), String(el.data("lang")));
        window.location.reload();
      });
    });
    $(".timezone-switcher-item").each(function () {
      let el = $(this);
      el.on("click", function () {
        Cookies.set(String(el.data("cookie-name")), String(el.data("tz")));
        window.location.reload();
      });
    });
    {% if timezone_config and timezone_config.use_user_locale_timezone %}
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (!Cookies.get('timezone') && timezone) {
      Cookies.set('timezone', timezone);
    }
    {% endif %}
  });
</script>
</body>

</html>
