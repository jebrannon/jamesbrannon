{% extends "@starlette-admin/base.html" %}
{% block title %}<title>JJ Admin / {{ title or app_title }}</title>{% endblock %}
{% block script %}
{{ super() }}
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
{% endblock %}
{% block head_meta %}
<link rel="icon" type="image/svg+xml" href="/static/admin-favicon.svg">
<link rel="stylesheet" href="/static/tokens.css">
{% endblock %}
{% block head_css %}
<script>document.documentElement.setAttribute('data-bs-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --tblr-font-sans-serif: 'Barlow Semi Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  /* ── Typography scale ───────────────────────────────────────────────────── */
  body {
    font-family: var(--font);
    font-size:   var(--fs-body);
    font-weight: var(--fw-body);
    line-height: var(--lh-body);
  }
  h1 {
    font-size:      var(--fs-h1);
    font-weight:    var(--fw-h1);
    font-style:     italic;
    line-height:    var(--lh-h1);
    letter-spacing: var(--ls-h1);
    text-transform: uppercase;
  }
  h2 {
    font-size:   var(--fs-h2) !important;
    font-weight: var(--fw-h2) !important;
    font-style:  italic !important;
    line-height: var(--lh-h2) !important;
  }
  h3 {
    font-size:   var(--fs-h3) !important;
    font-weight: var(--fw-h3) !important;
    font-style:  italic !important;
    line-height: var(--lh-h3) !important;
  }
  h4 {
    font-size:   var(--fs-h4) !important;
    font-weight: var(--fw-h4) !important;
    font-style:  italic !important;
    line-height: var(--lh-h4) !important;
  }
  h5, h6 {
    font-size:      var(--fs-h5) !important;
    font-weight:    var(--fw-h5) !important;
    font-style:     italic !important;
    line-height:    var(--lh-h5) !important;
    letter-spacing: var(--ls-h5) !important;
    text-transform: uppercase !important;
  }
  b, strong {
    font-weight: var(--fw-bold);
  }
  /* Brand logo: fixed 48×64 px, left-aligned in sidebar */
  .navbar-logo {
    width: 48px;
    height: 64px;
    display: block;
    margin: 0;
  }
  /* Tabler uses .navbar-vertical.navbar-expand-lg .navbar-brand (3-class specificity)
     for padding and centering — match it exactly to override */
  .navbar-vertical.navbar-expand-lg .navbar-brand {
    align-self: flex-start;
    justify-content: flex-start;
    padding: 2rem 1rem 1rem 1rem;
  }
  /* Hide mobile user-icon dropdown — logout is in the sidebar nav instead */
  .navbar-vertical .navbar-nav.flex-row.d-lg-none {
    display: none !important;
  }
  /* Sidebar headings — reset our typography scale so it never applies inside
     the nav (starlette-admin wraps the logo in an <h1> and fallback in <h3>) */
  .navbar-vertical h1,
  .navbar-vertical h2,
  .navbar-vertical h3 {
    font-size:      revert !important;
    font-weight:    revert !important;
    font-style:     revert !important;
    line-height:    revert !important;
    letter-spacing: revert !important;
    text-transform: revert !important;
  }
  /* Page header — 2rem top/side padding, 1rem bottom before content */
  .jb-page-header {
    padding: 2rem 2rem 1rem;
  }
  /* Page body — fills remaining height, consistent side/bottom padding */
  .jb-page-body {
    padding: 0 2rem 2rem;
    flex: 1;
  }
  /* Responsive — tighten side padding on small screens */
  @media (max-width: 768px) {
    .jb-page-header,
    .jb-page-body {
      padding-left: 1rem;
      padding-right: 1rem;
    }
  }
  /* Neutralise the container-fluid > row > col-12 that starlette-admin's
     create/edit templates inject directly into .jb-page-body — zeroing
     --tblr-gutter-x collapses both container padding and row negative margins */
  .jb-page-body > .container-fluid {
    --tblr-gutter-x: 0;
    padding: 0;
  }
  /* Sidebar nav — hover and active states darkened 80% from --jb-dark */
  .navbar-vertical .nav-link:hover,
  .navbar-vertical .nav-link.active,
  .navbar-vertical .dropdown-item:hover,
  .navbar-vertical .dropdown-item.active {
    background-color: color-mix(in srgb, var(--jb-dark) 80%, black);
  }
  /* Brand colour overrides — map jb palette to Tabler design tokens */
  [data-bs-theme=dark] {
    --tblr-body-bg:           var(--jb-dark);
    --tblr-bg-surface:        var(--jb-dark);
    --tblr-navbar-bg:         var(--jb-dark);
    --tblr-body-color:        var(--jb-light);
    --tblr-body-color-rgb:    251, 251, 251;
    --tblr-emphasis-color:    var(--jb-light);
    --tblr-link-color:        var(--jb-primary);
    --tblr-link-hover-color:  var(--jb-primary);
    --tblr-primary:           var(--jb-primary);
    --tblr-primary-rgb:       15, 206, 143;
    --tblr-primary-lt:        rgba(15, 206, 143, .1);
    --tblr-danger:                        var(--jb-secondary);
    --tblr-danger-rgb:                    255, 110, 112;
    --tblr-danger-lt:                     rgba(255, 110, 112, .1);
    --tblr-border-color:                  var(--jb-dark-grey);
    --tblr-border-color-translucent:      var(--jb-dark-grey);
    --tblr-border-active-color:           var(--jb-light-grey);
    --tblr-border-dark-color:             var(--jb-light-grey);
  }
  /* Primary button — dark text, light hover */
  .btn-primary {
    --tblr-btn-color:         var(--jb-dark);
    --tblr-btn-hover-color:   var(--jb-dark);
    --tblr-btn-active-color:  var(--jb-dark);
    --tblr-btn-disabled-color: var(--jb-dark);
    --tblr-btn-hover-bg:      var(--jb-light);
    --tblr-btn-active-bg:     var(--jb-light);
  }
  /* Cancel / danger buttons — light bg, dark text, no border; hover fills --jb-thoughts */
  .btn-danger {
    --tblr-btn-color:              var(--jb-dark);
    --tblr-btn-bg:                 var(--jb-light);
    --tblr-btn-border-color:       transparent;
    --tblr-btn-hover-color:        var(--jb-dark);
    --tblr-btn-hover-bg:           var(--jb-secondary);
    --tblr-btn-hover-border-color: transparent;
    --tblr-btn-active-color:       var(--jb-dark);
    --tblr-btn-active-bg:          var(--jb-secondary);
    background-color: var(--jb-light);
    border-color: transparent;
    color: var(--jb-dark);
  }
  /* Success buttons — identical styling to btn-primary */
  .btn-success {
    --tblr-btn-color:          var(--jb-dark);
    --tblr-btn-bg:             var(--jb-primary);
    --tblr-btn-border-color:   var(--jb-primary);
    --tblr-btn-hover-color:    var(--jb-dark);
    --tblr-btn-hover-bg:       var(--jb-light);
    --tblr-btn-hover-border-color: var(--jb-light);
    --tblr-btn-active-color:   var(--jb-dark);
    --tblr-btn-active-bg:      var(--jb-light);
    --tblr-btn-disabled-color: var(--jb-dark);
    background-color: var(--jb-primary);
    border-color: var(--jb-primary);
    color: var(--jb-dark);
  }
  /* Standard (non-primary/danger/success) buttons — dark-grey border, light text, light border on hover */
  .btn:not(.btn-primary):not(.btn-danger):not(.btn-success) {
    --tblr-btn-color:              var(--jb-light);
    --tblr-btn-border-color:       var(--jb-dark-grey);
    --tblr-btn-hover-color:        var(--jb-light);
    --tblr-btn-hover-border-color: var(--jb-light);
    color: var(--jb-light);
    border-color: var(--jb-dark-grey);
  }
  .btn:not(.btn-primary):not(.btn-danger):not(.btn-success):hover {
    border-color: var(--jb-light);
  }
  /* File upload — Choose file button: light bg, dark text */
  input[type="file"]::file-selector-button {
    background-color: var(--jb-light);
    color: var(--jb-dark);
    border: none;
    padding: .3rem .65rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    margin-right: .5rem;
  }
  input[type="file"]:hover::file-selector-button,
  input[type="file"]::file-selector-button:hover {
    background-color: var(--jb-primary) !important;
    color: var(--jb-dark) !important;
  }
  /* All badges — h5 token scale */
  .badge {
    font-size:      var(--fs-h5) !important;
    font-weight:    var(--fw-h5) !important;
    font-style:     italic !important;
    line-height:    var(--lh-h5) !important;
    letter-spacing: var(--ls-h5) !important;
    text-transform: uppercase !important;
  }
  /* Draft badge — jb-thoughts bg, dark text (list view + form header) */
  .badge.bg-warning {
    background-color: var(--jb-secondary) !important;
    color: var(--jb-dark) !important;
  }
  /* Form card headers only — no left padding or margin (dashboard/list cards keep defaults) */
  .card:has(> form) .card-header,
  .card:has(> form) .card-header > * {
    padding-left: 0;
    margin-left: 0;
  }
  /* SEO Settings panel — summary label always light */
  details summary {
    color: var(--jb-light) !important;
  }
  /* Global muted / secondary text — mapped to brand palette */
  .text-muted {
    color: var(--jb-light-grey) !important;
  }
  .text-secondary {
    color: var(--jb-light) !important;
  }
  /* Global text — body, paragraphs and anchors use light colour */
  body, p {
    color: var(--jb-light);
  }
  a {
    color: var(--jb-light);
  }
  a:hover {
    color: var(--jb-light);
  }
  /* Form inputs and textareas — brand colour styling */
  .form-control,
  .form-select {
    background-color: var(--jb-dark-grey);
    border-color: var(--jb-dark-grey);
    color: var(--jb-light);
  }
  .form-control::placeholder {
    color: var(--jb-light-grey);
    opacity: 1;
  }
  .form-control:focus,
  .form-select:focus {
    background-color: var(--jb-dark-grey);
    border-color: var(--jb-light);
    color: var(--jb-light);
    box-shadow: none;
  }
  .form-control:-webkit-autofill {
    -webkit-text-fill-color: var(--jb-light);
    box-shadow: 0 0 0 1000px var(--jb-dark-grey) inset;
  }
  /* Checkboxes and radio inputs — light background */
  .form-check-input {
    background-color: var(--jb-light);
    border-color: var(--jb-light);
  }
  /* Form page card — no border, no padding on the card body */
  .card:has(> form) {
    border: none;
    box-shadow: none;
  }
  .card > form > .card-body {
    padding: 0;
    border: none !important;
  }
  /* Form page card footer — strip all chrome */
  .card > form > .card-footer {
    padding: 0;
    margin: 0;
    background: none;
    border: none !important;
  }
  /* Fieldset legends — shared across Brand + Comms and all FieldsetCollectionFields */
  .jb-fieldset-legend {
    color: var(--jb-light);
    font-size: .8125rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  /* Labels — h5 token scale */
  .form-label,
  label {
    color:          var(--jb-light) !important;
    font-size:      var(--fs-h5) !important;
    font-weight:    var(--fw-h5) !important;
    font-style:     italic !important;
    line-height:    var(--lh-h5) !important;
    letter-spacing: var(--ls-h5) !important;
    text-transform: uppercase !important;
  }
  /* Hints and helper text — small token scale */
  .form-hint,
  .form-text,
  small {
    color:          var(--jb-light) !important;
    font-size:      var(--fs-small) !important;
    font-weight:    var(--fw-body) !important;
    font-style:     normal !important;
    line-height:    var(--lh-small) !important;
    letter-spacing: normal !important;
    text-transform: none !important;
  }
  /* Table card footer — dark-grey background */
  .card-footer {
    background-color: var(--jb-dark-grey);
  }
  /* Pagination disabled links — light-grey text */
  .disabled > .page-link {
    color: var(--jb-light-grey) !important;
  }
  /* Table headers — dark-grey background, light text */
  thead th,
  .table > thead > tr > th {
    background-color: var(--jb-dark-grey) !important;
    color: var(--jb-light) !important;
  }
  /* List page toolbar — search + new button, no page title or breadcrumb */
  .jb-list-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .jb-list-toolbar-left {
    display: flex;
    align-items: center;
    gap: .75rem;
    flex: 1;
  }
  .jb-list-toolbar-left .input-icon {
    flex: 1;
    max-width: 320px;
  }
  /* DataTables pagination — breathing room below the flat table */
  .dataTables_wrapper .dataTables_paginate {
    padding: .75rem 0;
  }
  .dataTables_wrapper .dataTables_info {
    padding: .75rem 0;
  }
  /* Custom sidebar icons — replace FontAwesome glyphs with brand SVGs */
  .fa-home::before,
  .fa-pencil::before,
  .fa-sign-out::before { content: '' !important; }
  .fa-home,
  .fa-pencil,
  .fa-sign-out {
    display: inline-block !important;
    width: 16px;
    height: 16px;
    background: center / contain no-repeat;
    vertical-align: -3px;
  }
  .fa-home     { background-image: url('/static/icons/home.svg'); }
  .fa-pencil   { background-image: url('/static/icons/message.svg'); }
  .fa-sign-out { background-image: url('/static/icons/logout.svg'); }
</style>
{% endblock %}
